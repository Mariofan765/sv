<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Клинок: острый треугольник от острия к гарде -->
  <polygon points="2,2 16.4,19.6 19.6,16.4" fill="#334036"/>

  <!-- Блик вдоль клинка (стальной отблеск) -->
  <line x1="4.5" y1="4.5" x2="16.5" y2="16.5"
        stroke="#f5f0e8" stroke-width="0.6" opacity="0.35"/>

  <!-- Гарда (крестовина) -->
  <line x1="14.5" y1="21.5" x2="21.5" y2="14.5"
        stroke="#8a6d3b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Декоративные шарики на концах гарды -->
  <circle cx="14.5" cy="21.5" r="1.3" fill="#8a6d3b"/>
  <circle cx="21.5" cy="14.5" r="1.3" fill="#8a6d3b"/>

  <!-- Рукоять -->
  <line x1="19" y1="19" x2="24.5" y2="24.5"
        stroke="#5a3e2b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Навершие (помел) -->
  <circle cx="25.5" cy="25.5" r="2.5" fill="#8a6d3b"/>
</svg>