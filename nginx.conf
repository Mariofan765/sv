server {
    listen 80;
    server_name svadba-anny-i-alekseya.ru
                www.svadba-anny-i-alekseya.ru
                xn------5cdabcchvsa9a5an1aa7dq6qoa6f.xn--p1ai
                www.xn------5cdabcchvsa9a5an1aa7dq6qoa6f.xn--p1ai;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: все запросы, не являющиеся файлами, перенаправляются на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических активов (JS, CSS, изображения)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}